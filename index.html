<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>나만의 나전칠기</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Song+Myung&family=Gowun+Dodum&family=Noto+Sans+KR:wght@900&display=swap">
<style>
/* Layout: one-screen lacquer table — title + four-step bar, the lacquer board as stage, one tool tray per step */
:root{
  --lacquer:#070707;
  --lacquer-2:#161515;
  --vermilion:#9a3324;
  --pearl:#ece6dc;
  --pearl-dim:#a8a197;
  --line:rgba(236,230,220,.16);
  --display:"Song Myung","Nanum Myeongjo","AppleMyungjo",serif;
  --body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color-scheme:dark;
}
html{height:100%;box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;background:var(--lacquer);color:var(--pearl);font-family:var(--body);overflow:hidden;-webkit-user-select:none;user-select:none}
[hidden]{display:none!important}
.app{height:100%;display:flex;flex-direction:column;gap:10px;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1200px;margin:0 auto}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:10px 16px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;gap:3px;min-width:0}
h1{font-family:var(--display);font-weight:400;font-size:clamp(24px,4.4vw,34px);line-height:1;margin:0;letter-spacing:.04em;text-wrap:balance}
h1 .seal{display:inline-grid;place-items:center;width:1.05em;height:1.05em;margin-left:.3em;font-size:.55em;vertical-align:.35em;background:var(--vermilion);color:var(--pearl);border-radius:3px;letter-spacing:0}
.sub{font-size:12.5px;color:var(--pearl-dim);margin:0}
.about{font:inherit;font-size:12px;color:var(--pearl);background:none;border:0;border-bottom:1px dotted var(--pearl-dim);padding:0;margin-left:6px;cursor:pointer}
.steps{display:flex;border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px;background:var(--lacquer-2);max-width:100%}
.steps button{font:inherit;font-size:14px;color:var(--pearl-dim);background:none;border:0;border-radius:999px;padding:7px 13px;cursor:pointer;white-space:nowrap}
.steps button[aria-current="step"]{background:var(--pearl);color:var(--lacquer)}
.steps b{font-weight:400;font-size:11px;display:inline-grid;place-items:center;width:17px;height:17px;border-radius:50%;border:1px solid currentColor;margin-right:4px;vertical-align:1px}
.stage{position:relative;flex:1;min-height:0;border-radius:6px;overflow:hidden;border:1px solid var(--line);background:var(--lacquer)}
canvas#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block;cursor:crosshair}
.hint{transition:opacity .6s}
.hint.dim{opacity:0}
.hint{position:absolute;left:10px;top:10px;right:10px;width:fit-content;font-size:12.5px;line-height:1.4;color:var(--pearl);pointer-events:none;background:rgba(7,7,7,.66);padding:5px 10px;border-radius:12px}
.toast{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);width:max-content;max-width:calc(100% - 24px);font-size:13px;line-height:1.45;background:rgba(236,230,220,.95);color:var(--lacquer);padding:8px 14px;border-radius:8px;pointer-events:none;text-align:center}
.cam{position:absolute;right:10px;bottom:10px;width:min(30%,150px);aspect-ratio:4/3;max-width:100%;border-radius:6px;overflow:hidden;border:1px solid var(--line);background:#000}
.cam video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1);opacity:.75}
.cam span{position:absolute;left:6px;top:4px;font-size:11px;color:var(--pearl)}
.tray{display:flex;gap:10px 14px;align-items:center;flex-wrap:wrap;min-height:44px}
.chip{display:none}
.chip.always{display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.chip[aria-expanded="true"]{border-color:var(--pearl);background:#2b2522}
.group[data-always]:not(.open){display:none}
.group[data-fold].open{display:flex;flex-wrap:wrap;position:fixed;z-index:20;background:var(--lacquer-2);border:1px solid var(--line);border-radius:12px;padding:12px;gap:8px;box-shadow:0 10px 30px rgba(0,0,0,.65);max-width:min(620px,calc(100vw - 32px))}
.group[data-fold].open .label{width:100%;margin-top:2px}
.zoomui{position:absolute;right:10px;top:10px;display:flex;align-items:center;gap:2px;background:rgba(7,7,7,.7);border:1px solid var(--line);border-radius:999px;padding:3px;z-index:4;font-size:12px;font-variant-numeric:tabular-nums}
.zoomui button{font:inherit;color:var(--pearl);background:none;border:0;min-width:30px;height:28px;border-radius:999px;cursor:pointer;font-size:15px}
.zoomui button:disabled{opacity:.35;cursor:default}
.zoomui #zFit{font-size:12px;padding:0 8px}
.zoomui span{min-width:40px;text-align:center;color:var(--pearl-dim);padding-left:6px}
.txtin{font:inherit;font-size:14px;color:var(--pearl);background:var(--lacquer-2);border:1px solid var(--line);border-radius:8px;padding:7px 9px;width:6.5em;min-height:38px}
.lq i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px;border:1px solid var(--line)}
.seg2 .tbtn{min-width:44px}
.loupe-note{display:none}
.undo .ico{display:none}
.subg{display:contents}
.tools{display:flex;gap:10px 14px;align-items:center;flex-wrap:wrap;flex:1;min-width:0}
.group{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.label{font-size:11.5px;color:var(--pearl-dim);letter-spacing:.06em;margin-right:2px}
.tbtn{font:inherit;font-size:13.5px;color:var(--pearl);background:var(--lacquer-2);border:1px solid var(--line);border-radius:8px;padding:8px 12px;cursor:pointer;min-height:38px}
.tbtn[aria-pressed="true"]{border-color:var(--pearl);background:#2b2522}
.tbtn[data-kind="carve"]{color:#e3b878}
.tbtn:disabled{opacity:.4;cursor:default}
.cta{font:inherit;font-size:14.5px;background:var(--vermilion);color:var(--pearl);border:0;border-radius:8px;padding:9px 16px;cursor:pointer;min-height:40px;margin-left:auto}
.swatch{width:34px;height:34px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0;outline-offset:2px}
.swatch[aria-pressed="true"]{border-color:var(--pearl);box-shadow:0 0 0 2px var(--lacquer) inset}
.sw0{background:conic-gradient(from 30deg,#a9d8cf,#9db4d6,#c3b2de,#e0bfd4,#b5dccb,#a9d8cf)}
.sw1{background:conic-gradient(from 30deg,#f3ece2,#e6d3d8,#d8e3ea,#f1e6cf,#f3ece2)}
.sw2{background:conic-gradient(from 30deg,#d5e3bd,#b9dcc8,#ece0c0,#c4e0d6,#d5e3bd)}
.sw3{background:conic-gradient(from 30deg,#e9cf9a,#d9a96a,#f1dcae,#c99a63,#e9cf9a)}
.shellname{font-size:13px;min-width:3.5em}
.dot{display:inline-block;border-radius:50%;background:var(--pearl);vertical-align:middle}
.meter{display:flex;align-items:center;gap:8px;font-size:13px;font-variant-numeric:tabular-nums}
.meter .bar{width:140px;max-width:40vw;height:8px;border-radius:999px;background:var(--lacquer-2);border:1px solid var(--line);overflow:hidden}
.meter .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#9fd3cc,#c8b8e2,#ecd9b4);transition:width .3s}
.name{display:flex;align-items:center;gap:6px}
.name input{font:inherit;font-size:14px;color:var(--pearl);background:var(--lacquer-2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:11em;min-height:38px}
.name input:focus-visible,button:focus-visible{outline:2px solid var(--pearl);outline-offset:2px}
@media (max-width:620px){
  .cta{margin-left:0;width:100%}
  .subtxt{display:none}.about{margin-left:0}
  .steps{width:100%}.steps button{flex:1;padding:7px 4px;font-size:13px}
  .tray{flex-direction:column;align-items:stretch;flex-wrap:nowrap;gap:8px}
  .tools{width:100%;flex:none}
  .tools{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;gap:12px;padding-bottom:2px}
  .tools::-webkit-scrollbar{display:none}
  .tools .group{flex-wrap:nowrap;flex:none}
  .tbtn,.label{white-space:nowrap}.tbtn{padding:7px 10px;font-size:13px}
  .meter{flex:none}
  .chip{display:inline-flex;align-items:center;gap:4px;flex:none;white-space:nowrap}
  .group[data-fold]:not(.open){display:none}
  .group[data-fold].open{left:max(16px,env(safe-area-inset-left,0px))!important;right:max(16px,env(safe-area-inset-right,0px));max-width:none}
  .tools .group:not([data-fold]) > .label,.shellname,.name .label{display:none}
  .name input{width:8.5em}
  .swatch{width:28px;height:28px}
  .tools,.tools .group{gap:6px}
  .tbtn{padding:7px 9px}
  .undo .txt{display:none}.undo .ico{display:inline;font-size:17px;line-height:1}.undo{min-width:40px}
}
</style>

</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <h1>나만의 나전칠기<span class="seal">螺</span></h1>
      <p class="sub"><span class="subtxt">도안을 그리고, 자개를 붙이고, 옻칠을 갈아내 완성해요</span><button class="about" id="bAbout">나전칠기란?</button></p>
    </div>
    <nav class="steps" aria-label="만드는 순서">
      <button data-step="1" aria-current="step"><b>1</b>도안</button>
      <button data-step="2"><b>2</b>자개</button>
      <button data-step="3"><b>3</b>옻칠·연마</button>
      <button data-step="4"><b>4</b>완성</button>
    </nav>
  </header>

  <div class="stage" id="stage">
    <canvas id="cv"></canvas>
    <div class="hint" id="hint"></div>
    <div class="cam" id="cam" hidden><video id="vid" playsinline muted></video><span id="camState">손 찾는 중…</span></div>
    <div class="toast" id="toast" hidden></div>
    <div class="zoomui" id="zoomUi" hidden>
      <span id="zPct">100%</span><button id="zFit">원래 크기</button>
    </div>
  </div>

  <!-- 1 도안 -->
  <div class="tray" id="tray1">
    <div class="tools">
    <div class="group" role="group" aria-label="펜" data-fold="펜">
      <span class="label">펜</span>
      <button class="tbtn" data-kind="cut" aria-pressed="true" title="둘러싼 칸이 자개 한 조각이 돼요">윤곽선</button>
      <button class="tbtn" data-kind="carve" aria-pressed="false" title="칸을 나누지 않고 자개 위에 칼선으로 새겨져요">새김선</button>
      <button class="tbtn" id="bErase" aria-pressed="false">지우개</button>
      <span class="label">굵기</span>
      <button class="tbtn" data-pen="0" aria-pressed="true">가늘게</button>
      <button class="tbtn" data-pen="1" aria-pressed="false">굵게</button>
    </div>
    <div class="group" role="group" aria-label="모양" data-fold="모양">
      <span class="label">모양</span>
      <button class="tbtn" data-shape="free" aria-pressed="true">자유선</button>
      <button class="tbtn" data-shape="line" aria-pressed="false">직선</button>
      <button class="tbtn" data-shape="circle" aria-pressed="false">원</button>
      <button class="tbtn" data-shape="rect" aria-pressed="false">네모</button>
      <button class="tbtn" data-shape="leaf" aria-pressed="false">잎</button>
      <button class="tbtn" data-shape="petal" aria-pressed="false">꽃잎</button>
      <button class="tbtn" data-shape="star" aria-pressed="false">별</button>
    </div>
    <div class="group" role="group" aria-label="장식" data-fold="장식" data-always="1">
      <span class="label">장식</span>
      <button class="tbtn" data-stamp="corner" aria-pressed="false">모서리 넝쿨</button>
      <button class="tbtn" data-stamp="flower" aria-pressed="false">꽃</button>
      <button class="tbtn" data-stamp="mountain" aria-pressed="false">산</button>
      <button class="tbtn" data-stamp="plum" aria-pressed="false">매화</button>
      <button class="tbtn" data-stamp="chrys" aria-pressed="false">국화</button>
      <button class="tbtn" data-stamp="butterfly" aria-pressed="false">나비</button>
      <button class="tbtn" data-stamp="cloud" aria-pressed="false">구름</button>
      <button class="tbtn" data-stamp="wave" aria-pressed="false">물결</button>
      <button class="tbtn" data-stamp="hex" aria-pressed="false">귀갑문</button>
      <button class="tbtn" data-stamp="frame" aria-pressed="false">테두리</button>
      <span class="label">글자</span>
      <input id="stampText" class="txtin" maxlength="8" placeholder="넣을 글자" value="福">
      <button class="tbtn" data-stamp="text" aria-pressed="false">글자 붙이기</button>
    </div>
    <div class="group" role="group" aria-label="편집" data-fold="편집" data-nostate="1" data-always="1">
      <span class="label">편집</span>
      <button class="tbtn" id="bSelect" aria-pressed="false">선택·옮기기</button>
      <button class="tbtn" id="bDup" disabled>복제</button>
      <button class="tbtn" id="bDelSel" disabled>고른 것 지우기</button>
      <button class="tbtn" id="bMirror" aria-pressed="false">좌우 대칭</button>
      <button class="tbtn" id="bClear">모두 지우기</button>
      <button class="tbtn" id="bSample">예시 도안</button>
      <span class="label">밑그림 사진</span>
      <button class="tbtn" id="bPhoto">사진 깔기</button>
      <button class="tbtn" id="bPhotoOff" hidden>사진 치우기</button>
      <input type="file" id="photoIn" accept="image/*" hidden>
      <span class="label">옻칠 바탕</span>
      <button class="tbtn lq" data-lacq="black" aria-pressed="true"><i style="background:#141414"></i>흑칠</button>
      <button class="tbtn lq" data-lacq="red" aria-pressed="false"><i style="background:#5e1d14"></i>주칠</button>
      <button class="tbtn lq" data-lacq="brown" aria-pressed="false"><i style="background:#3d2616"></i>갈색칠</button>
    </div>
    <div class="group">
      <button class="tbtn undo" id="bUndo1" aria-label="되돌리기"><span class="ico" aria-hidden="true">↶</span><span class="txt">되돌리기</span></button>
    </div>
    </div>
    <button class="cta" id="go2">자개 붙이러 가기</button>
  </div>

  <!-- 2 자개 붙이기 -->
  <div class="tray" id="tray2" hidden>
    <div class="tools">
    <div class="group" role="group" aria-label="자개 종류">
      <span class="label">자개</span>
      <button class="swatch sw0" data-type="0" aria-pressed="true" aria-label="전복패" title="전복패"></button>
      <button class="swatch sw1" data-type="1" aria-pressed="false" aria-label="진주패" title="진주패"></button>
      <button class="swatch sw2" data-type="2" aria-pressed="false" aria-label="야광패" title="야광패"></button>
      <button class="swatch sw3" data-type="3" aria-pressed="false" aria-label="황패" title="황패"></button>
      <span class="shellname" id="shellName">전복패</span>
    </div>
    <div class="group seg2" role="group" aria-label="붙일 곳">
      <span class="label">붙일 곳</span>
      <button class="tbtn" data-tool="fill" aria-pressed="true">칸</button>
      <button class="tbtn" data-tool="line" aria-pressed="false">선</button>
    </div>
    <div class="group" role="group" aria-label="붓" data-fold="붓">
      <span class="label">붓</span>
      <button class="tbtn" data-tool="feather" aria-pressed="false">깃털</button>
      <button class="tbtn" data-tool="scale" aria-pressed="false">비늘</button>
      <button class="tbtn" data-tool="needle" aria-pressed="false">솔잎</button>
      <button class="tbtn" data-tool="strip" aria-pressed="false">끊음질</button>
      <span class="subg" id="sizeGroup" hidden>
        <span class="label">크기</span>
        <button class="tbtn" data-size="0" aria-pressed="false" aria-label="작게"><span class="dot" style="width:5px;height:5px"></span></button>
        <button class="tbtn" data-size="1" aria-pressed="true" aria-label="보통"><span class="dot" style="width:10px;height:10px"></span></button>
        <button class="tbtn" data-size="2" aria-pressed="false" aria-label="크게"><span class="dot" style="width:16px;height:16px"></span></button>
      </span>
      <span class="label">한 번에</span>
      <button class="tbtn" id="bAuto">빈 칸 모두 채우기</button>
    </div>
    <div class="group">
      <button class="tbtn undo" id="bUndo2" aria-label="되돌리기"><span class="ico" aria-hidden="true">↶</span><span class="txt">되돌리기</span></button>
    </div>
    </div>
    <button class="cta" id="go3">옻칠하고 갈아내기</button>
  </div>

  <!-- 3 옻칠·연마 -->
  <div class="tray" id="tray3" hidden>
    <div class="tools">
    <div class="meter"><span class="label">연마</span><span class="bar"><i id="meterFill"></i></span><span id="meterTxt">0%</span></div>
    <div class="group">
      <button class="tbtn bCam">카메라로 갈아내기</button>
      <button class="tbtn" id="bPolishAll">한 번에 갈아내기</button>
    </div>
    </div>
  </div>

  <!-- 4 완성 -->
  <div class="tray" id="tray4" hidden>
    <div class="tools">
    <div class="group">
      <label class="name" for="workName"><span class="label">작품 이름</span><input id="workName" maxlength="14" value="나의 첫 나전칠기" placeholder="작품 이름"></label>
      <button class="tbtn" id="bSave">작품 저장</button>
    </div>
    <div class="group" data-fold="더보기" data-nostate="1">
      <button class="tbtn bCam">카메라로 만지기</button>
      <button class="tbtn bTilt">기울여 보기</button>
    </div>
    </div>
    <button class="cta" id="bNew">새 작품 만들기</button>
  </div>
</div>

<script>
(() => {
const $ = id => document.getElementById(id);
const $$ = q => document.querySelectorAll(q);
const stage = $('stage'), cv = $('cv');
let ctx = cv.getContext('2d');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

const INK = ['#b9d8d6', '#eeeae6', '#d6e2c4', '#e6c894'];
const INK_RGB = INK.map(h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16)));
const SHELL_NAME = ['전복패', '진주패', '야광패', '황패'];
const SIZES = [0.012, 0.026, 0.05];

let W = 0, H = 0, M = 0, DPR = 1, ASPECT = 0, BW = 0, BH = 0;
let step = 1;
let doan = [], deco = [], fills = [], hist = [];
let penKind = 'cut', shape = 'free';
// 도형: 시작점 a에서 끝점 b까지 끌어서 만든 점 목록(모서리가 둥글게 뭉개지지 않도록 촘촘하게)
function shapePts(kind, a, b) {
  const [x0, y0] = a, [x1, y1] = b, P = [];
  const seg = (p, q, n) => { for (let i = 0; i < n; i++) P.push([p[0] + (q[0] - p[0]) * i / n, p[1] + (q[1] - p[1]) * i / n]); };
  const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2, rx = Math.abs(x1 - x0) / 2, ry = Math.abs(y1 - y0) / 2;
  const dx = x1 - x0, dy = y1 - y0, len = Math.hypot(dx, dy) || 1, ux = dx / len, uy = dy / len;
  if (kind === 'line') { seg(a, b, 24); P.push(b); }
  else if (kind === 'circle') { for (let i = 0; i <= 72; i++) { const t = i / 72 * 6.2832; P.push([cx + Math.cos(t) * rx, cy + Math.sin(t) * ry]); } }
  else if (kind === 'rect') { const c = [[x0, y0], [x1, y0], [x1, y1], [x0, y1]]; for (let k = 0; k < 4; k++) seg(c[k], c[(k + 1) % 4], 16); P.push([x0, y0]); }
  else if (kind === 'leaf' || kind === 'petal') {
    // 잎: 양 끝이 뾰족한 렌즈 / 꽃잎: 끝이 둥글고 밑이 뾰족한 물방울

    const cosT = Math.sqrt(1 - Math.min(.95, ax * ax + ay * ay) / 2.34);   // 진주층 굴절률 1.53
    const opd = B.od[q] * cosT * (1 + rip * .1 + g * .04) + drift * 40;
    // 광로차를 무지개 한 바퀴(빨-노-초-청-보)로 고르게 펼친다 → 각도가 바뀌면 띠가 흐른다
    let ph1 = opd * .0016129; ph1 -= Math.floor(ph1);
    const li = ((ph1 * 256) | 0) * 3, k = B.ik[q] * (1 - Math.min(.5, g * .3)) * 1.25;
    const ir = NAC_LUT[li], ig = NAC_LUT[li + 1], ib = NAC_LUT[li + 2], avg = 0;
    // 연마한 표면을 지나가는 빛줄기
    const swp = sweepOn ? Math.exp(-(((x * .8 + y * .6) / sweepN - sweepPos) ** 2) / .0032) : 0;
    const glint = Math.pow(Math.max(0, facet), 5);
    const shv = B.sh[q] * (.6 + .4 * Math.cos(opd * .004 + tilt));
    const L = Math.min(.95, Math.max(.18, (B.lb[q] + facet * 4 + g * 10 + glint * 8 + rip * 10 + shv * (9 + g * 18) + swp * 9) / 100));
    const T = P.tint, o = B.pos[q];
    d[o] = (L + (ir - avg) * k) * T[0] * 255; d[o + 1] = (L + (ig - avg) * k) * T[1] * 255; d[o + 2] = (L + (ib - avg) * k) * T[2] * 255; d[o + 3] = 255;
  }
  B.fctx.putImageData(B.img, 0, 0);
  const lc = B.lctx, LW = B.layer.width, LH = B.layer.height;
  lc.globalCompositeOperation = 'source-over';
  lc.clearRect(0, 0, LW, LH);
  lc.imageSmoothingEnabled = true; lc.imageSmoothingQuality = 'high';
  lc.drawImage(B.field, 0, 0, LW, LH);
  lc.globalCompositeOperation = 'destination-in';
  lc.drawImage(B.maskHi, 0, 0);
  lc.globalCompositeOperation = 'source-over';
  ctx.drawImage(B.layer, 0, 0);

  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.globalCompositeOperation = 'screen';
  for (const L of lights) {
    const gr = ctx.createRadialGradient(L.x, L.y, 0, L.x, L.y, R * 1.5);
    gr.addColorStop(0, `rgba(255,244,230,${.09 * L.s})`); gr.addColorStop(1, 'rgba(255,244,230,0)');
    ctx.fillStyle = gr; ctx.fillRect(L.x - R * 1.5, L.y - R * 1.5, R * 3, R * 3);
    if (step === 4 && L.touch && Math.hypot(L.x - L.px, L.y - L.py) > 6 && Math.random() < .5) burst(L.x + (Math.random() - .5) * 30, L.y + (Math.random() - .5) * 30, 1);
  }
  ctx.globalCompositeOperation = 'lighter';
  for (let i = glints.length - 1; i >= 0; i--) {   // 자개 위에서 반짝 빛나는 점
    const k = glints[i], a = (t - k.t0) / k.life;
    if (a >= 1) { glints.splice(i, 1); continue; }
    const v = Math.sin(Math.PI * a), r = k.r * (.4 + .8 * v);
    const gl = ctx.createRadialGradient(k.x, k.y, 0, k.x, k.y, r * 2.2);
    gl.addColorStop(0, `rgba(255,252,246,${.55 * v})`); gl.addColorStop(1, 'rgba(255,252,246,0)');
    ctx.fillStyle = gl; ctx.fillRect(k.x - r * 2.2, k.y - r * 2.2, r * 4.4, r * 4.4);
    ctx.fillStyle = `rgba(255,253,248,${.8 * v})`;
    ctx.beginPath();
    ctx.moveTo(k.x, k.y - r * 2); ctx.lineTo(k.x + r * .18, k.y - r * .18); ctx.lineTo(k.x + r * 2, k.y);
    ctx.lineTo(k.x + r * .18, k.y + r * .18); ctx.lineTo(k.x, k.y + r * 2); ctx.lineTo(k.x - r * .18, k.y + r * .18);
    ctx.lineTo(k.x - r * 2, k.y); ctx.lineTo(k.x - r * .18, k.y - r * .18); ctx.closePath(); ctx.fill();
  }
  for (let i = sparks.length - 1; i >= 0; i--) {
    const k = sparks[i];
    k.life -= 1 / 50; if (k.life <= 0) { sparks.splice(i, 1); continue; }
    k.x += k.vx / 60; k.y += k.vy / 60; k.vx *= .94; k.vy *= .94;
    const r = k.r * (0.5 + k.life);
    ctx.fillStyle = `hsla(${k.h},35%,90%,${k.life * .85})`;
    ctx.beginPath();
    ctx.moveTo(k.x, k.y - r * 2); ctx.lineTo(k.x + r * .4, k.y - r * .4); ctx.lineTo(k.x + r * 2, k.y);
    ctx.lineTo(k.x + r * .4, k.y + r * .4); ctx.lineTo(k.x, k.y + r * 2); ctx.lineTo(k.x - r * .4, k.y + r * .4);
    ctx.lineTo(k.x - r * 2, k.y); ctx.lineTo(k.x - r * .4, k.y - r * .4); ctx.closePath(); ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';
  for (const p of pointers.values()) { p.px = p.x; p.py = p.y; }
  for (const h of hands) { h.px = h.x; h.py = h.y; }
}

/* ---------- 단계 ---------- */
const HINT = {
  1: '윤곽선으로 둘러싼 칸이 자개 한 조각이 돼요 · 잎맥이나 꽃잎 결은 새김선으로 그려요',
  fill: '칸 · 누른 채 움직이면 붙을 칸이 밝게 보이고, 손을 떼면 자개가 붙어요 · 같은 자개로 다시 누르면 떼어요',
  line: '선 · 도안 선을 누르면 그 선 전체에 끊음질 자개가 입혀져요 · 선 가까이만 눌러도 돼요',
  feather: '깃털 · 그은 방향으로 깃 조각이 엇갈려 붙어요. 날개와 꼬리에',
  scale: '비늘 · 둥근 조각이 겹쳐 붙어요. 몸통 깃털, 물고기, 솔방울에',
  needle: '솔잎 · 짧게 그으면 솔잎 뭉치가 피어나요',
  strip: '끊음질 · 띠를 끊어 이어 붙여요. 줄기, 다리, 테두리에',
  4: '완성! 손가락을 움직이거나 기기를 기울이면 보는 각도에 따라 자개빛이 바뀌어요 · 톡 누르면 빛 물결',
};
function goStep(n) {
  if (n >= 2 && !doan.some(s => !s.erase)) { toast('먼저 도안을 그려 주세요.'); return; }
  try {
    if (n >= 2 && (!REG || step === 1)) { if (!REG) computeRegions(); compose(); }
    if (n >= 3 && !inlayCount) { toast('칸을 눌러 자개를 하나 이상 붙여 주세요.'); n = 2; }
    const from = step;
    step = n;
    if (n >= 2 && (from === 1 || !NB)) buildNacre();
    if (n === 3) initCover(false);
    if (n === 4 && from !== 3) { polish.done = true; polish.fade = 0; }
  } catch (e) { reportError(e); }
  if (step <= 2 && camOn) stopCamera();
  closeFolds();
  pick = null; touchAt = null; pickRid = -1;
  live = null; down = null; liveStamp = null; drag1 = null; if (step !== 1) sel = null; pointers.clear(); sparks.length = 0;
  $$('.steps button').forEach(b => b.dataset.step == step ? b.setAttribute('aria-current', 'step') : b.removeAttribute('aria-current'));
  for (let k = 1; k <= 4; k++) $('tray' + k).hidden = k !== step;
  $('hint').textContent = step === 1 ? HINT[1] : step === 2 ? HINT[tool] : step === 4 ? HINT[4] : '';
  if (step === 3) updateMeter();
  cv.style.cursor = step <= 2 ? 'crosshair' : 'pointer';
  setCamLabels(); updateButtons();
  dirty = true;
}
function updateButtons() {
  $('bUndo1').disabled = !hist1.length; $('bClear').disabled = !doan.length;
  $('bDelSel').disabled = sel == null; $('bDup').disabled = sel == null;
  $('bUndo2').disabled = !hist.length;
}

/* ---------- 휴대폰: 도구 묶음을 접어 한 줄로 ---------- */
const PHONE = matchMedia('(max-width:620px)');
function chipLabel() {
  $$('.group[data-fold]').forEach(g => {
    const on = g.dataset.nostate ? null : [...g.querySelectorAll('[aria-pressed="true"]')].find(b => !b.closest('#sizeGroup'));
    g._chip.textContent = (on ? (on.textContent.trim() || on.getAttribute('aria-label')) : g.dataset.fold) + ' ▾';
    g._chip.setAttribute('aria-label', g.dataset.fold + (on ? ': ' + (on.textContent.trim() || on.getAttribute('aria-label')) : ''));
  });
}
function closeFolds() { $$('.group[data-fold].open').forEach(g => { g.classList.remove('open'); g._chip.setAttribute('aria-expanded', 'false'); }); }
$$('.group[data-fold]').forEach(g => {
  const chip = document.createElement('button');
  chip.className = 'tbtn chip' + (g.dataset.always ? ' always' : ''); chip.type = 'button'; chip.setAttribute('aria-expanded', 'false');
  g.before(chip); g._chip = chip;
  chip.onclick = () => {
    const open = !g.classList.contains('open'); closeFolds();
    if (!open) return;
    g.style.bottom = (innerHeight - g.closest('.tray').getBoundingClientRect().top + 8) + 'px';
    g.style.left = Math.max(16, Math.min(chip.getBoundingClientRect().left, innerWidth - 640)) + 'px';
    g.classList.add('open'); chip.setAttribute('aria-expanded', 'true');
  };
  g.addEventListener('click', e => { const b = e.target.closest('button'); if (b && (PHONE.matches || g.dataset.always) && !b.closest('#sizeGroup') && b.id !== 'bPhotoOff') setTimeout(closeFolds, 150); });
});
document.addEventListener('pointerdown', e => { if (!e.target.closest('.group.open, .chip')) closeFolds(); });
new MutationObserver(chipLabel).observe(document.querySelector('.app'), { subtree: true, attributes: true, attributeFilter: ['aria-pressed'] });
chipLabel();

document.addEventListener('keydown', e => {
  if (e.target.closest && e.target.closest('input, textarea')) return;
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); const u = step === 1 ? $('bUndo1') : step === 2 ? $('bUndo2') : null; if (u && !u.disabled) u.click(); }
  else if ((e.key === 'Delete' || e.key === 'Backspace') && step === 1 && sel != null) { e.preventDefault(); $('bDelSel').click(); }
  else if ((e.ctrlKey || e.metaKey) && (e.key.toLowerCase() === 'd' || e.key.toLowerCase() === 'v') && step === 1 && sel != null) { e.preventDefault(); duplicateSel(); }
  else if (e.key === 'Escape') { closeFolds(); if (sel != null) { sel = null; updateButtons(); dirty = true; } }
});

$$('.steps button').forEach(b => b.onclick = () => goStep(+b.dataset.step));
$('go2').onclick = () => goStep(2);
$('go3').onclick = () => goStep(3);
function syncPen() {
  $$('[data-kind]').forEach(x => x.setAttribute('aria-pressed', !erasing && x.dataset.kind === penKind));
  $$('[data-pen]').forEach(x => x.setAttribute('aria-pressed', +x.dataset.pen === penSize));
  $('bErase').setAttribute('aria-pressed', erasing);
}
$$('[data-kind]').forEach(b => b.onclick = () => { penKind = b.dataset.kind; erasing = false; syncPen(); if (tool1 !== 'draw') setTool1('draw'); });
$$('[data-pen]').forEach(b => b.onclick = () => { penSize = +b.dataset.pen; erasing = false; syncPen(); });
$('bErase').onclick = () => { erasing = !erasing; syncPen(); setTool1('draw'); };
$$('[data-shape]').forEach(b => b.onclick = () => {
  shape = b.dataset.shape; erasing = false; syncPen(); setTool1('draw');
});
$('bMirror').onclick = () => { mirror = !mirror; $('bMirror').setAttribute('aria-pressed', mirror); dirty = true; };
$('bUndo1').onclick = () => {
  if (!hist1.length) return;
  const h = hist1.pop(); doan = h.doan; fills = h.fills; deco = h.deco; sel = null; drag1 = null;
  renderDoan(); doanChanged(); dirty = true;
};
$('bClear').onclick = () => { snap1(); doan = []; fills = []; deco = []; hist = []; sel = null; renderDoan(); doanChanged(); };
$('bDup').onclick = duplicateSel;
$('zFit').onclick = () => { zoomView.z = 1; zoomView.x = 0; zoomView.y = 0; applyZoom(); };
$('bPhoto').onclick = () => $('photoIn').click();
$('photoIn').onchange = e => {
  const f = e.target.files && e.target.files[0]; if (!f) return;
  const img = new Image();
  img.onload = () => { photo = img; $('bPhotoOff').hidden = false; dirty = true; toast('사진을 흐리게 깔았어요. 윤곽선으로 따라 그려 보세요. 사진은 완성 작품에 들어가지 않아요.', 5000); };
  img.onerror = () => toast('이 파일은 열 수 없어요. 사진 파일(jpg, png)을 골라 주세요.');
  img.src = URL.createObjectURL(f); e.target.value = '';
};
$('bPhotoOff').onclick = () => { photo = null; $('bPhotoOff').hidden = true; dirty = true; };
$$('[data-lacq]').forEach(b => b.onclick = () => {
  lacq = b.dataset.lacq;
  $$('[data-lacq]').forEach(x => x.setAttribute('aria-pressed', x === b));
  try { buildLacquer(); if (NB) buildNacre(); } catch (er) { reportError(er); }
  dirty = true;
});
$('stampText').addEventListener('input', () => { if (tool1 !== 'stamp' || stampKind !== 'text') { erasing = false; syncPen(); setTool1('stamp', 'text'); } });
$('bSelect').onclick = () => setTool1(tool1 === 'select' ? 'draw' : 'select');
$('bDelSel').onclick = () => { if (sel == null) return; snap1(); doan = doan.filter(s => s.g !== sel); sel = null; renderDoan(); doanChanged(); dirty = true; };
$$('[data-stamp]').forEach(b => b.onclick = () => { erasing = false; syncPen(); setTool1('stamp', b.dataset.stamp); });
$('bSample').onclick = () => { snap1(); sel = null; doan = sampleDoan(); fills = []; deco = []; hist = []; renderDoan(); doanChanged(); toast('달과 매화 가지 도안이에요. 고치거나 더 그려도 돼요.'); };
$$('[data-type]').forEach(b => b.onclick = () => {
  curType = +b.dataset.type; $('shellName').textContent = SHELL_NAME[curType];
  $$('[data-type]').forEach(x => x.setAttribute('aria-pressed', x === b));
});
$$('[data-tool]').forEach(b => b.onclick = () => {
  tool = b.dataset.tool; $('hint').textContent = HINT[tool];
  $('sizeGroup').hidden = tool === 'fill' || tool === 'line';
  $$('[data-tool]').forEach(x => x.setAttribute('aria-pressed', x === b));
});
$$('[data-size]').forEach(b => b.onclick = () => {
  decoSize = +b.dataset.size;
  $$('[data-size]').forEach(x => x.setAttribute('aria-pressed', x === b));
});
$('bAuto').onclick = autoFill;
$('bUndo2').onclick = () => {
  const h = hist.pop(); if (!h) return;
  fills = h.fills; doan.forEach((s, i) => s.inlay = h.inl[i] ?? null); deco.length = h.deco;
  compose(); updateButtons();
};
$('bPolishAll').onclick = finishPolish;
$$('.bCam').forEach(b => b.onclick = startCamera);
$$('.bTilt').forEach(b => b.onclick = enableTilt);
$('bNew').onclick = () => { doan = []; fills = []; deco = []; hist = []; renderDoan(); doanChanged(); goStep(1); toast('새 옻칠 판이에요. 도안부터 그려 보세요.'); };
$('bAbout').onclick = () => toast('나전칠기는 전복·조개 껍데기를 얇게 갈아 무늬대로 오려 붙이고, 옻칠을 여러 번 덮은 뒤 갈아내 자개를 드러내는 우리 전통 공예예요. 모양대로 오려 붙이는 주름질, 가는 띠를 끊어 붙이는 끊음질이 대표 기법이에요.', 8000);
const dlP = window.claude?.use ? window.claude.use('downloads').catch(() => null) : Promise.resolve(null);
$('bSave').onclick = () => {
  cv.toBlob(async b => {
    if (!b) return;
    const name = (($('workName').value || '').trim() || '나만의 나전칠기') + '.png';
    const dl = await dlP;
    if (dl) { try { await dl.save({ filename: name, data: b }); } catch {} return; }
    const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  });
};

applyZoom();
if (document.fonts && document.fonts.load) document.fonts.load('900 40px "Noto Sans KR"', '복').then(() => glyphCache.clear()).catch(() => {});
{ let ht = 0; const h = $('hint'); const show = () => { h.classList.remove('dim'); clearTimeout(ht); ht = setTimeout(() => h.classList.add('dim'), 6000); };
  new MutationObserver(show).observe(h, { childList: true, characterData: true, subtree: true }); show(); }
doan = sampleDoan();
resize();
goStep(1);
requestAnimationFrame(frame);
})();
</script>
